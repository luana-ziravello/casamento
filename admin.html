<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel — Luana &amp; Heitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27%23FEF8E0%27/%3E%3Ccircle cx=%2726%27 cy=%2732%27 r=%2716%27 fill=%27%23F46B30%27 opacity=%27.9%27/%3E%3Ccircle cx=%2738%27 cy=%2732%27 r=%2716%27 fill=%27%23E82F5D%27 opacity=%27.85%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=9">
<style>
  body { background: var(--areia-0); }
  :root { --verde: #3f7d4e; --verde-bg: rgba(63, 125, 78, .14); }

  /* ===== tela de senha ===== */
  .portao {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
    background: var(--areia-0);
  }
  .portao.escondido { display: none; }
  .portao-caixa {
    width: 100%; max-width: 360px;
    background: var(--tinta-clara);
    border: 1px solid var(--dourado-linha);
    box-shadow: var(--sombra-card);
    padding: var(--sp-xl) var(--sp-lg);
    text-align: center;
    position: relative; overflow: hidden;
  }
  .portao-caixa::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--gradiente-luxo); }
  .portao-caixa h1 { font-family: var(--f-display); font-style: italic; font-size: 1.6rem; color: var(--tinta); margin-bottom: .4rem; }
  .portao-caixa p { font-size: .8rem; color: var(--tinta-suave); margin-bottom: var(--sp-md); }
  .portao-campo { position: relative; margin-bottom: .9rem; }
  .portao-caixa input {
    width: 100%; height: 48px; padding: 0 44px 0 14px;
    border: 1px solid var(--linha-forte); background: var(--areia-0);
    font-family: var(--f-corpo); font-size: .95rem; color: var(--tinta); text-align: center;
  }
  .portao-caixa input:focus { border-color: var(--rosa); outline: none; }
  .portao-olho {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer; color: var(--tinta-suave);
  }
  .portao-olho:hover, .portao-olho:focus-visible { color: var(--rosa-texto); }
  .portao-olho svg { width: 19px; height: 19px; }
  .portao-caixa .btn { width: 100%; height: 48px; }
  .portao-erro { font-size: .78rem; color: var(--rosa-texto); margin-top: .8rem; min-height: 1.1em; }

  /* ===== layout do painel ===== */
  .painel { max-width: 920px; margin: 0 auto; padding: clamp(1.4rem, 5vw, 3rem) clamp(1.2rem, 4vw, 2.5rem) var(--sp-3xl); display: none; }
  .painel.visivel { display: block; }

  .painel-topo { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: var(--sp-lg); }
  .painel-topo h1 { font-family: var(--f-display); font-style: italic; font-size: clamp(1.8rem, 5vw, 2.6rem); color: var(--tinta); }
  .painel-sair { background: none; border: none; cursor: pointer; font-family: var(--f-corpo); font-size: .68rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--tinta-suave); }
  .painel-sair:hover { color: var(--rosa-texto); }

  .abas { display: flex; gap: .5rem; flex-wrap: wrap; border-bottom: 1px solid var(--linha-forte); margin-bottom: var(--sp-lg); }
  .aba {
    background: none; border: none; cursor: pointer;
    padding: .8rem 1rem; margin-bottom: -1px;
    font-family: var(--f-corpo); font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--tinta-suave); border-bottom: 2px solid transparent;
  }
  .aba.ativa { color: var(--rosa-texto); border-bottom-color: var(--rosa-texto); }

  .secao { display: none; padding: 0; animation: aparecer .3s ease; }
  .secao.ativa { display: block; }

  .cartoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .9rem; margin-bottom: var(--sp-lg); }
  .cartao { background: var(--tinta-clara); border: 1px solid var(--dourado-linha); padding: 1.1rem 1.2rem; }
  .cartao .n { font-family: var(--f-display); font-size: 1.9rem; color: var(--tinta); line-height: 1.1; }
  .cartao .r { font-size: .66rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-suave); margin-top: .3rem; }
  .cartao.destaque .n { color: var(--rosa-texto); }
  .cartao.verde .n { color: var(--verde); }

  .filtros { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: var(--sp-md); }
  .filtro { background: var(--areia-0); border: 1px solid var(--linha-forte); cursor: pointer; padding: .5rem .9rem; font-family: var(--f-corpo); font-size: .74rem; color: var(--tinta); }
  .filtro.ativo { background: var(--rosa-texto); border-color: var(--rosa-texto); color: var(--tinta-clara); }

  .grupo { margin-bottom: var(--sp-md); }
  .grupo-titulo { font-family: var(--f-display); font-style: italic; font-size: 1.2rem; color: var(--tinta); margin-bottom: .4rem; padding-bottom: .3rem; border-bottom: 1px solid var(--linha); }
  .linha { display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: .55rem 0; border-top: 1px solid var(--linha); font-size: .9rem; color: var(--tinta); }
  .linha:first-child { border-top: none; }
  .linha-direita { display: flex; align-items: center; gap: .6rem; flex-shrink: 0; }
  .linha-whatsapp {
    width: 26px; height: 26px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background-color: #25D366; border-radius: 50%;
    transition: transform .2s ease;
  }
  .linha-whatsapp:hover, .linha-whatsapp:focus-visible { transform: scale(1.1); }
  .linha-whatsapp svg { width: 15px; height: 15px; }

  .selo { font-size: .62rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: .25rem .55rem; border-radius: 999px; white-space: nowrap; }
  .selo.sim { background: var(--verde-bg); color: var(--verde); }
  .selo.nao { background: rgba(122,78,33,.12); color: var(--tinta-suave); }
  .selo.sem { background: rgba(122,78,33,.07); color: var(--tinta-suave); }
  .selo.approved { background: rgba(197,40,80,.12); color: var(--rosa-texto); }
  .selo.pending { background: rgba(255,201,77,.22); color: #8a6d1e; }
  .selo.rejected, .selo.cancelled { background: rgba(122,78,33,.12); color: var(--tinta-suave); }

  .pedido { background: var(--tinta-clara); border: 1px solid var(--dourado-linha); padding: 1rem 1.2rem; margin-bottom: .8rem; }
  .pedido-topo { display: flex; align-items: baseline; justify-content: space-between; gap: .8rem; flex-wrap: wrap; }
  .pedido-acoes { display: flex; align-items: center; gap: .5rem; flex-shrink: 0; }
  .pedido-remover {
    width: 24px; height: 24px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: none; border: 1px solid var(--linha-forte); border-radius: 999px;
    cursor: pointer; color: var(--tinta-suave); font-size: .78rem; line-height: 1;
  }
  .pedido-remover:hover, .pedido-remover:focus-visible { border-color: var(--rosa-texto); color: var(--rosa-texto); }
  .pedido-nome { font-weight: 600; color: var(--tinta); }
  .pedido-data { font-size: .72rem; color: var(--tinta-suave); }
  .pedido-itens { list-style: none; padding: 0; margin: .6rem 0 0; }
  .pedido-itens li { display: flex; justify-content: space-between; gap: .8rem; font-size: .84rem; color: var(--tinta-suave); padding: .2rem 0; }
  .pedido-total { display: flex; justify-content: space-between; gap: .8rem; margin-top: .5rem; padding-top: .5rem; border-top: 1px solid var(--linha); font-size: .9rem; font-weight: 600; color: var(--tinta); }
  .pedido-msg { margin-top: .6rem; padding: .7rem .9rem; background: var(--areia-0); border-left: 3px solid var(--rosa); font-size: .84rem; color: var(--tinta); line-height: 1.7; }

  .recado { background: var(--tinta-clara); border: 1px solid var(--dourado-linha); padding: 1rem 1.2rem; margin-bottom: .8rem; }
  .recado-cab { display: flex; align-items: baseline; justify-content: space-between; gap: .8rem; margin-bottom: .4rem; }
  .recado-de { font-weight: 600; color: var(--tinta); }
  .recado-quando { font-size: .72rem; color: var(--tinta-suave); }
  .recado-txt { font-size: .88rem; color: var(--tinta); line-height: 1.75; }

  /* ===== fornecedores ===== */
  .forn-linha {
    display: flex; align-items: center; justify-content: space-between; gap: .8rem;
    padding: .8rem 0; border-top: 1px solid var(--linha);
  }
  .forn-linha:first-child { border-top: none; }
  .forn-info { display: flex; flex-direction: column; gap: 2px; cursor: pointer; min-width: 0; background: none; border: none; text-align: left; padding: 0; font: inherit; }
  .forn-empresa { font-weight: 600; color: var(--tinta); }
  .forn-empresa:hover, .forn-info:focus-visible .forn-empresa { color: var(--rosa-texto); }
  .forn-servico { font-size: .76rem; color: var(--tinta-suave); }
  .forn-acoes { display: flex; align-items: center; gap: .5rem; flex-shrink: 0; }
  .forn-icone {
    width: 28px; height: 28px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%; background: none; border: 1px solid var(--linha-forte);
    color: var(--tinta-suave); cursor: pointer; transition: transform .2s ease, border-color .2s ease, color .2s ease;
  }
  .forn-icone:hover, .forn-icone:focus-visible { transform: scale(1.08); border-color: var(--rosa-texto); color: var(--rosa-texto); }
  .forn-icone svg { width: 14px; height: 14px; }
  .forn-icone.whatsapp { background-color: #25D366; border-color: #25D366; color: #fff; }
  .forn-icone.whatsapp svg { width: 15px; height: 15px; }
  .forn-icone.whatsapp:hover, .forn-icone.whatsapp:focus-visible { color: #fff; border-color: #25D366; }
  .forn-icone.desativado { opacity: .3; pointer-events: none; }
  .selo.quitado { background: var(--verde-bg); color: var(--verde); }
  .selo.pendente { background: rgba(255,201,77,.22); color: #8a6d1e; }

  .cartao-filtro { cursor: pointer; font: inherit; text-align: left; width: 100%; appearance: none; -webkit-appearance: none; transition: border-color .2s ease, box-shadow .2s ease; }
  .cartao-filtro:hover, .cartao-filtro:focus-visible { border-color: var(--rosa-texto); }
  .cartao-filtro.ativo-filtro { border-color: var(--rosa-texto); box-shadow: 0 0 0 2px rgba(197,40,80,.15); }

  /* botão flutuante "+" pra adicionar fornecedor */
  .fab-add {
    position: fixed; right: 24px; bottom: 24px; z-index: 260;
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--gradiente-luxo); color: var(--tinta-clara); border: none;
    font-size: 1.8rem; line-height: 1; cursor: pointer;
    box-shadow: var(--sombra-botao);
    display: none; align-items: center; justify-content: center;
    transition: transform .2s ease;
  }
  .fab-add.visivel { display: flex; }
  .fab-add:hover, .fab-add:focus-visible { transform: scale(1.08); }

  /* modal de detalhe/edição de fornecedor */
  .forn-detalhe-campo { margin-bottom: var(--sp-md); }
  .forn-detalhe-rotulo { display: block; font-size: .66rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-suave); margin-bottom: .3rem; }
  .forn-detalhe-valor { font-size: .92rem; color: var(--tinta); }
  .forn-toggle-linha { display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: .7rem 0; border-top: 1px solid var(--linha); }
  .forn-toggle-linha:first-child { border-top: none; }
  .forn-toggle-btn {
    border: 1px solid var(--linha-forte); background: var(--areia-0); cursor: pointer;
    padding: .4rem .9rem; font-family: var(--f-corpo); font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-suave);
  }
  .forn-toggle-btn.ativo { background: var(--verde); border-color: var(--verde); color: #fff; }

  .campo-form { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--sp-md); text-align: left; }
  .campo-form label { font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-suave); }
  .campo-form label .opcional { text-transform: none; letter-spacing: 0; font-weight: 400; opacity: .7; }
  .campo-form input, .campo-form select {
    height: 44px; padding: 0 12px; border: 1px solid var(--linha-forte); background: var(--areia-0);
    font-family: var(--f-corpo); font-size: .9rem; color: var(--tinta);
  }
  .campo-form input:focus, .campo-form select:focus { border-color: var(--rosa); outline: none; }
  .forn-form-erro { font-size: .78rem; color: var(--rosa-texto); min-height: 1.1em; margin-bottom: .6rem; }
  .forn-remover-link { display: block; text-align: center; margin-top: var(--sp-sm); background: none; border: none; cursor: pointer; font-size: .74rem; color: var(--tinta-suave); text-decoration: underline; }
  .forn-remover-link:hover { color: var(--rosa-texto); }

  .album-admin-thumb { width: 52px; height: 52px; object-fit: cover; border-radius: 4px; flex-shrink: 0; background: var(--areia-0); }
  .album-admin-comentarios { margin-top: .7rem; padding-top: .6rem; border-top: 1px dashed var(--linha); display: flex; flex-direction: column; gap: .4rem; }
  .album-admin-comentario { display: flex; align-items: center; justify-content: space-between; gap: .6rem; font-size: .82rem; color: var(--tinta); }
  .album-admin-comentario span { line-height: 1.5; }

  .estado { padding: 2.5rem 1rem; text-align: center; font-size: .86rem; color: var(--tinta-suave); }
</style>
</head>
<body>

<div class="portao" id="portao">
  <form class="portao-caixa" id="portaoForm">
    <h1>Painel dos noivos</h1>
    <p>Área restrita. Digite a senha para continuar.</p>
    <div class="portao-campo">
      <input type="password" id="portaoSenha" placeholder="Senha" autocomplete="current-password" required>
      <button type="button" class="portao-olho" id="portaoOlho" aria-label="Mostrar senha" aria-pressed="false"></button>
    </div>
    <button class="btn btn-primario" type="submit">Entrar</button>
    <p class="portao-erro" id="portaoErro"></p>
  </form>
</div>

<main class="painel" id="painel">
  <div class="painel-topo">
    <h1>Painel</h1>
    <button class="painel-sair" id="btnSair" type="button">Sair</button>
  </div>

  <div class="abas" role="tablist">
    <button class="aba ativa" data-secao="confirmacoes" role="tab" type="button">Confirmações</button>
    <button class="aba" data-secao="presentes" role="tab" type="button">Presentes</button>
    <button class="aba" data-secao="recados" role="tab" type="button">Recados</button>
    <button class="aba" data-secao="album" role="tab" type="button">Álbum</button>
    <button class="aba" data-secao="fornecedores" role="tab" type="button">Fornecedores</button>
  </div>

  <section class="secao ativa" id="secao-confirmacoes">
    <div class="cartoes" id="confCartoes"></div>
    <div class="filtros" id="confFiltros">
      <button class="filtro ativo" data-f="todos" type="button">Todos</button>
      <button class="filtro" data-f="sim" type="button">Confirmados</button>
      <button class="filtro" data-f="nao" type="button">Não vão</button>
      <button class="filtro" data-f="sem" type="button">Sem resposta</button>
    </div>
    <div id="confLista"><p class="estado">Carregando…</p></div>
  </section>

  <section class="secao" id="secao-presentes">
    <div class="cartoes" id="presCartoes"></div>
    <div class="filtros" id="presFiltros">
      <button class="filtro ativo" data-f="todos" type="button">Todos</button>
      <button class="filtro" data-f="approved" type="button">Aprovados</button>
      <button class="filtro" data-f="pending" type="button">Pendentes</button>
    </div>
    <div id="presLista"><p class="estado">Carregando…</p></div>
  </section>

  <section class="secao" id="secao-recados">
    <div class="cartoes" id="recCartoes"></div>
    <div id="recLista"><p class="estado">Carregando…</p></div>
  </section>

  <section class="secao" id="secao-album">
    <div class="cartoes" id="albumCartoes"></div>
    <div id="albumLista"><p class="estado">Carregando…</p></div>
  </section>

  <section class="secao" id="secao-fornecedores">
    <div class="cartoes" id="fornCartoes"></div>
    <div id="fornLista"><p class="estado">Carregando…</p></div>
  </section>
</main>

<button class="fab-add" id="fabAddFornecedor" type="button" aria-label="Adicionar fornecedor" title="Adicionar fornecedor">+</button>

<!-- MODAL DETALHE DO FORNECEDOR -->
<div class="modal-overlay" id="modalFornDetalhe" role="dialog" aria-modal="true" aria-labelledby="fornDetalheTitulo" onclick="fecharModalFora(event, 'modalFornDetalhe')">
  <div class="modal-caixa">
    <button class="modal-fechar" onclick="fecharModal('modalFornDetalhe')" aria-label="Fechar">✕</button>
    <span class="modal-tag" id="fornDetalheServico"></span>
    <h2 id="fornDetalheTitulo"></h2>
    <div id="fornDetalheCorpo"></div>
  </div>
</div>

<!-- MODAL ADICIONAR/EDITAR FORNECEDOR -->
<div class="modal-overlay" id="modalFornForm" role="dialog" aria-modal="true" aria-labelledby="fornFormTitulo" onclick="fecharModalFora(event, 'modalFornForm')">
  <div class="modal-caixa">
    <button class="modal-fechar" onclick="fecharModal('modalFornForm')" aria-label="Fechar">✕</button>
    <span class="modal-tag">Fornecedor</span>
    <h2 id="fornFormTitulo">Adicionar fornecedor</h2>
    <form id="fornForm">
      <input type="hidden" id="fornFormId">
      <div class="campo-form">
        <label for="fornFormServico">Serviço</label>
        <input type="text" id="fornFormServico" required placeholder="Ex.: Buffet, DJ, Fotografia…">
      </div>
      <div class="campo-form">
        <label for="fornFormEmpresa">Empresa</label>
        <input type="text" id="fornFormEmpresa" required placeholder="Nome da empresa">
      </div>
      <div class="campo-form">
        <label for="fornFormResponsavel">Responsável <span class="opcional">(opcional)</span></label>
        <input type="text" id="fornFormResponsavel" placeholder="Nome de quem atende">
      </div>
      <div class="campo-form">
        <label for="fornFormTelefone">Telefone <span class="opcional">(opcional)</span></label>
        <input type="text" id="fornFormTelefone" placeholder="+55 11 90000-0000">
      </div>
      <div class="campo-form">
        <label for="fornFormStatus">Status</label>
        <select id="fornFormStatus">
          <option value="quitado">Quitado</option>
          <option value="pendente">Pendente</option>
        </select>
      </div>
      <div class="campo-form">
        <label for="fornFormStatusDetalhe">Valor pendente <span class="opcional">(opcional — deixe "total" se nada foi pago)</span></label>
        <input type="text" id="fornFormStatusDetalhe" placeholder="Ex.: 1100 ou total">
      </div>
      <div class="campo-form">
        <label for="fornFormReuniaoData">Reunião agendada <span class="opcional">(opcional)</span></label>
        <input type="text" id="fornFormReuniaoData" placeholder="Ex.: 02/10 às 21h">
      </div>
      <div class="campo-form">
        <label for="fornFormReuniaoLink">Link da reunião <span class="opcional">(opcional)</span></label>
        <input type="text" id="fornFormReuniaoLink" placeholder="Link do Meet/Zoom, se houver">
      </div>
      <p class="forn-form-erro" id="fornFormErro"></p>
      <button class="btn btn-primario" type="submit" id="fornFormSalvar">Salvar</button>
    </form>
    <button class="forn-remover-link" id="fornFormRemover" type="button">Remover este fornecedor</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/admin.js?v=7"></script>
</body>
</html>

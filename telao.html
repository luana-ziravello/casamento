<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telão da votação — Luana &amp; Heitor</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27%23FEF8E0%27/%3E%3Ccircle cx=%2726%27 cy=%2732%27 r=%2716%27 fill=%27%23F46B30%27 opacity=%27.9%27/%3E%3Ccircle cx=%2738%27 cy=%2732%27 r=%2716%27 fill=%27%23E82F5D%27 opacity=%27.85%27/%3E%3C/svg%3E">
<style>
  /* Telão: pensado para 16:9 projetado num salão escuro, lido de longe.
     Paleta do casamento sobre o marrom-tinta do rodapé do site. */
  @font-face { font-family: 'Cardo'; src: url('fonts/Cardo-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Cardo'; src: url('fonts/Cardo-Italic.ttf') format('truetype'); font-weight: 400; font-style: italic; font-display: swap; }

  :root {
    --fundo: #3A2A1E;
    --fundo-fundo: #2A1D14;
    --marfim: #FEF8E0;
    --marfim-suave: rgba(254, 248, 224, .68);
    --coral: #F46B30;
    --rosa: #E82F5D;
    --dourado: #E8B84B;
    --amarelo: #FFC94D;
    --gradiente: linear-gradient(100deg, #F46B30 0%, #E82F5D 55%, #E8B84B 100%);
    --f-display: 'Cardo', Georgia, serif;
    --f-corpo: 'Montserrat', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 40%, var(--fundo) 0%, var(--fundo-fundo) 100%);
    color: var(--marfim);
    font-family: var(--f-corpo); font-weight: 300;
    overflow: hidden;
    cursor: default;
  }
  body.cursor-oculto, body.cursor-oculto * { cursor: none !important; }

  /* manchas de aquarela, como no topo das páginas do site */
  .manchas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .manchas span { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .22; }
  .manchas .m1 { width: 46vw; height: 40vw; left: -12vw; top: -14vw; background: var(--rosa); }
  .manchas .m2 { width: 44vw; height: 38vw; right: -14vw; bottom: -16vw; background: var(--coral); }
  .manchas .m3 { width: 26vw; height: 22vw; right: 6vw; top: -10vw; background: var(--amarelo); opacity: .14; }

  /* moldura fina do convite */
  .moldura { position: fixed; inset: 1.4vh; border: 1px solid rgba(232, 184, 75, .28); pointer-events: none; z-index: 6; }
  .moldura::after { content: ''; position: absolute; inset: .6vh; border: 1px solid rgba(232, 184, 75, .14); }

  .tela {
    position: relative; z-index: 2;
    height: 100vh; width: 100vw;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 5vh 6vw 5vh;
  }

  .topo { display: flex; align-items: center; justify-content: space-between; }
  .topo img { height: 6vh; width: auto; filter: brightness(0) invert(1); opacity: .85; }
  .topo p { font-family: var(--f-display); font-style: italic; font-size: 2.4vh; color: var(--marfim-suave); }

  .centro {
    min-height: 0; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 1vh;
  }
  .lider-rotulo { font-size: 2.9vh; letter-spacing: .02em; color: var(--marfim-suave); }
  .lider-nome {
    font-family: var(--f-display); font-style: italic; font-weight: 400;
    font-size: min(17vh, 11vw); line-height: 1.08;
    max-width: 82vw; overflow-wrap: anywhere;
    background: var(--gradiente); -webkit-background-clip: text; background-clip: text; color: transparent;
    padding: 0 .1em .08em;
  }
  .lider-vazio { font-family: var(--f-display); font-style: italic; font-size: min(10vh, 6.5vw); line-height: 1.15; color: var(--marfim); }

  .cronometro { margin-top: 3.5vh; display: flex; flex-direction: column; align-items: center; }
  .cronometro-digitos {
    font-family: var(--f-display); font-size: min(19vh, 12vw); line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: .02em; color: var(--marfim);
  }
  .cronometro.urgente .cronometro-digitos { color: var(--amarelo); animation: pulsar 1s ease-in-out infinite; }
  @keyframes pulsar { 50% { opacity: .55; } }
  .cronometro-status { margin-top: 1.2vh; font-family: var(--f-display); font-style: italic; font-size: 3.4vh; color: var(--marfim-suave); }
  .cronometro.encerrada .cronometro-status { color: var(--amarelo); font-size: 4vh; }

  .base { display: flex; align-items: flex-end; justify-content: space-between; gap: 2vw; }
  .participe { display: flex; align-items: center; gap: 1.6vw; }
  .participe-qr { width: 15vh; height: 15vh; background: var(--marfim); padding: 1vh; border-radius: .6vh; }
  .participe-qr svg, .participe-qr img { width: 100%; height: 100%; display: block; }
  .participe-texto { font-size: 2.4vh; line-height: 1.5; color: var(--marfim-suave); }
  .participe-texto strong { display: block; font-family: var(--f-display); font-style: italic; font-weight: 400; font-size: 3.6vh; color: var(--marfim); }
  .controles { display: flex; gap: .8vw; }
  .controles button {
    font: 500 1.6vh var(--f-corpo); letter-spacing: .04em;
    background: transparent; color: var(--marfim-suave);
    border: 1px solid rgba(254, 248, 224, .3); border-radius: 999px; padding: 1vh 1.6vw; cursor: pointer;
    transition: opacity .4s;
  }
  body.cursor-oculto .controles button { opacity: 0; }
  .controles button:focus-visible { outline: 2px solid var(--amarelo); outline-offset: 3px; }

  /* ===== balões "+1 voto" ===== */
  .camada-votos { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
  .voto-flutuante { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; opacity: 0; will-change: transform, opacity; transform-origin: 50% 100%; }
  .voto-flutuante-texto {
    font-family: var(--f-display); font-style: italic; font-size: var(--tam, 3.4vh); white-space: nowrap;
    color: var(--fundo-fundo); background: var(--cor, var(--coral));
    padding: .18em .75em; border-radius: 999px;
  }
  .voto-flutuante-fio { width: 1px; height: 4vh; background: linear-gradient(rgba(254,248,224,.5), transparent); }

  /* ===== "Novo recorde!!!!" ===== */
  .recorde {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(70% 70% at 50% 50%, #3E2C1F 0%, #1E140D 100%);
    opacity: 0; pointer-events: none; transition: opacity .45s ease;
  }
  .recorde.ativo { opacity: 1; }
  .recorde-titulo {
    font-family: var(--f-display); font-style: italic; font-size: min(20vh, 13vw); line-height: 1; color: var(--amarelo);
    text-shadow: 0 0 6vh rgba(255, 201, 77, .35);
  }
  .recorde-nome {
    margin-top: 4vh; max-width: 86vw; overflow-wrap: anywhere;
    font-family: var(--f-display); font-style: italic; font-size: min(15vh, 10vw); line-height: 1.1;
    background: var(--gradiente); -webkit-background-clip: text; background-clip: text; color: transparent;
    padding: 0 .1em .08em;
  }
  .recorde-sub { margin-top: 2.4vh; font-size: 3vh; color: var(--marfim-suave); }
  .recorde.ativo .recorde-titulo { animation: estourar .9s cubic-bezier(.2, 1.6, .4, 1) both, chacoalhar 2.4s ease-in-out .9s 2; }
  .recorde.ativo .recorde-nome { animation: subirNome .8s cubic-bezier(.2, 1.3, .4, 1) .35s both; }
  .recorde.ativo .recorde-sub { animation: subirNome .8s ease .6s both; }
  @keyframes estourar { 0% { transform: scale(.2) rotate(-8deg); opacity: 0; } 60% { transform: scale(1.12) rotate(2deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
  @keyframes chacoalhar { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-2.5deg) scale(1.03); } 40% { transform: rotate(2deg); } 60% { transform: rotate(-1.5deg) scale(1.02); } 80% { transform: rotate(1deg); } }
  @keyframes subirNome { from { transform: translateY(6vh) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }

  .confete { position: fixed; inset: 0; z-index: 11; pointer-events: none; overflow: hidden; }
  .confete i {
    position: absolute; top: -4vh; width: var(--w); height: var(--h); background: var(--c); border-radius: 1px;
    animation: cair var(--d) cubic-bezier(.25, .6, .4, 1) var(--a) forwards;
  }
  @keyframes cair {
    0% { transform: translate3d(0, 0, 0) rotate(0); opacity: 1; }
    100% { transform: translate3d(var(--x), 112vh, 0) rotate(var(--r)); opacity: .9; }
  }

  /* ===== indisponível ===== */
  .espera { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2vh; }
  .espera h1 { font-family: var(--f-display); font-style: italic; font-weight: 400; font-size: 9vh; }
  .espera p { font-size: 3vh; color: var(--marfim-suave); }

  @media (prefers-reduced-motion: reduce) {
    .camada-votos, .confete { display: none; }
    .recorde.ativo .recorde-titulo, .recorde.ativo .recorde-nome, .recorde.ativo .recorde-sub,
    .cronometro.urgente .cronometro-digitos { animation: none; }
  }
</style>
</head>
<body>

<div class="manchas" aria-hidden="true"><span class="m1"></span><span class="m2"></span><span class="m3"></span></div>
<div class="moldura" aria-hidden="true"></div>
<div class="camada-votos" id="camadaVotos" aria-hidden="true"></div>

<div class="espera" id="telaEspera" hidden>
  <h1 id="esperaTitulo">A votação abre na festa</h1>
  <p id="esperaTexto">Esta tela se atualiza sozinha.</p>
</div>

<main class="tela" id="telaPrincipal" hidden>
  <header class="topo">
    <img src="imagens/monograma.png" alt="Luana &amp; Heitor" width="1254" height="1254">
    <p>Brincadeira da gravata</p>
  </header>

  <section class="centro" aria-live="polite">
    <div id="liderBloco">
      <p class="lider-vazio">Quem vai inaugurar a brincadeira?</p>
    </div>
    <div class="cronometro" id="cronometro">
      <div class="cronometro-digitos" id="cronometroDigitos" role="timer">20:00</div>
      <p class="cronometro-status" id="cronometroStatus">A votação começará em instantes!</p>
    </div>
  </section>

  <footer class="base">
    <div class="participe">
      <div class="participe-qr" id="qrParticipe" aria-hidden="true"></div>
      <p class="participe-texto"><strong>Participe pelo celular</strong>Aponte a câmera para o código</p>
    </div>
    <div class="controles">
      <button type="button" id="btnTelaCheia">Tela cheia</button>
    </div>
  </footer>
</main>

<div class="recorde" id="recorde" role="status" aria-live="assertive">
  <p class="recorde-titulo">Novo recorde!!!!</p>
  <p class="recorde-nome" id="recordeNome"></p>
  <p class="recorde-sub">fez a maior contribuição até agora</p>
</div>
<div class="confete" id="confete" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="js/config.js?v=2"></script>
<script src="js/telao.js?v=1"></script>
</body>
</html>
